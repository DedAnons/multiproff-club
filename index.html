<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог сайтов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #121214;
      color: #e1e1e6;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 24px;
      font-size: 28px;
    }

    /* Список плашек */
    .site-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Плашка сайта — кликабельна вся целиком */
    .site-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background-color: #202024;
      border: 1px solid #29292e;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s, border-color 0.2s;
    }

    .site-card:hover {
      background-color: #29292e;
      border-color: #00875f;
      transform: translateY(-2px);
    }

    .site-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background-color: #121214;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #00b37e;
    }

    .site-info {
      flex: 1;
    }

    .site-title {
      font-size: 18px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .site-desc {
      font-size: 14px;
      color: #a8a8b3;
    }

    /* Затемнение фона при открытии шторки */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 900;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Выезжающая шторка справа */
    .drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      max-width: 100%;
      height: 100%;
      background-color: #202024;
      border-left: 1px solid #29292e;
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.5);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    .drawer.active {
      right: 0;
    }

    .drawer-header {
      padding: 24px;
      border-bottom: 1px solid #29292e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-title {
      font-size: 20px;
      color: #ffffff;
    }

    .close-btn {
      background: none;
      border: none;
      color: #a8a8b3;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    .close-btn:hover {
      color: #ffffff;
    }

    .drawer-content {
      padding: 24px;
      flex: 1;
      overflow-y: auto;
    }

    .drawer-content p {
      line-height: 1.6;
      color: #c4c4cc;
      margin-bottom: 20px;
    }

    .visit-btn {
      display: inline-block;
      padding: 12px 20px;
      background-color: #00875f;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .visit-btn:hover {
      background-color: #00b37e;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Список сайтов</h1>

    <div class="site-list">

      <!-- Плашка 1 (вся кликабельна) -->
      <div class="site-card" onclick="openDrawer('Multiproff Club', 'Информационный портал и анонсы серверов Lineage 2 с мультипрофессией.', 'https://example.com')">
        <div class="site-icon">MC</div>
        <div class="site-info">
          <div class="site-title">Multiproff Club</div>
          <div class="site-desc">Портал серверов Lineage 2</div>
        </div>
      </div>

      <!-- Плашка 2 (вся кликабельна) -->
      <div class="site-card" onclick="openDrawer('Пример Сайта 2', 'Подробное описание второго сайта с дополнительными деталями и характеристиками.', 'https://example.com')">
        <div class="site-icon">S2</div>
        <div class="site-info">
          <div class="site-title">Пример Сайта 2</div>
          <div class="site-desc">Краткая плашка с описанием</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Фон-затемнение -->
  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>

  <!-- Шторка -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h2 class="drawer-title" id="drawerTitle">Название сайта</h2>
      <button class="close-btn" onclick="closeDrawer()">&times;</button>
    </div>
    <div class="drawer-content">
      <p id="drawerDesc">Полное описание появится здесь при клике на плашку.</p>
      <a href="#" id="drawerLink" target="_blank" class="visit-btn">Перейти на сайт</a>
    </div>
  </div>

  <script>
    function openDrawer(title, description, link) {
      document.getElementById('drawerTitle').innerText = title;
      document.getElementById('drawerDesc').innerText = description;
      document.getElementById('drawerLink').href = link;

      document.getElementById('drawer').classList.add('active');
      document.getElementById('overlay').classList.add('active');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('active');
      document.getElementById('overlay').classList.remove('active');
    }

    // Закрытие шторки по клавише Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeDrawer();
      }
    });
  </script>
</body>
</html>
