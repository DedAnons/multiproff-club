<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiproff Club</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse для чтения Google Таблиц -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    /* Фоновое изображение (HD арт) */
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      background-image: 
        linear-gradient(to bottom, rgba(15, 23, 42, 0.40), rgba(11, 15, 25, 0.65)),
        url('https://cdna.artstation.com/p/assets/images/images/013/794/960/large/ekaterina-chesalova-l2-contest-res.jpg?1541113219');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    
    /* Эффект матового стекла для карточек (Glassmorphism) */
    .glass-panel {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(10px);
    }

    /* Эффект свечения VIP карточки */
    .vip-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25) 0%, rgba(15, 23, 42, 0.90) 100%);
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
      backdrop-filter: blur(12px);
    }

    /* Плавный аккордеон */
    .accordion-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease-out;
    }
    .accordion-content.open { grid-template-rows: 1fr; }
    .accordion-inner { overflow: hidden; }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-between">

  <div class="max-w-7xl mx-auto w-full">
    
    <!-- Шапка с кнопкой Связь -->
    <header class="relative text-center mb-8 border-b border-slate-700/50 pb-6 flex flex-col items-center justify-center">
      
      <!-- Кнопка Telegram (Связь) -->
      <div class="md:absolute md:right-0 md:top-2 mb-4 md:mb-0">
        <a href="https://t.me/Misterpandatipa" target="_blank" class="glass-panel hover:bg-sky-500/20 text-sky-400 border border-sky-500/40 hover:border-sky-400 px-3.5 py-1.5 rounded-lg text-sm font-semibold transition inline-flex items-center gap-2 shadow-sm">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.008-1.252-.241-1.865-.44-.752-.244-1.349-.374-1.297-.789.027-.216.324-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.141.119.098.152.228.166.322.016.108.035.334.02.514z"/>
          </svg>
          Связь
        </a>
      </div>

      <h1 class="text-4xl md:text-5xl font-black text-amber-400 tracking-wider uppercase drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)]">
        Multiproff Club
      </h1>
    </header>

    <!-- VIP Блок -->
    <div id="vip-container" class="mb-6"></div>

    <!-- Фильтры Хроник -->
    <div class="flex flex-wrap gap-2 justify-center mb-6">
      <button onclick="filterChronicle('ALL')" class="glass-panel hover:bg-slate-700/80 text-slate-200 px-3.5 py-1.5 rounded-lg text-sm font-medium transition border border-slate-700/50">Все</button>
      <button onclick="filterChronicle('Interlude')" class="glass-panel hover:bg-slate-700/80 text-amber-400 px-3.5 py-1.5 rounded-lg text-sm font-medium transition border border-slate-700/50">Interlude</button>
      <button onclick="filterChronicle('High Five')" class="glass-panel hover:bg-slate-700/80 text-amber-400 px-3.5 py-1.5 rounded-lg text-sm font-medium transition border border-slate-700/50">High Five</button>
      <button onclick="filterChronicle('Main/Essence')" class="glass-panel hover:bg-slate-700/80 text-amber-400 px-3.5 py-1.5 rounded-lg text-sm font-medium transition border border-slate-700/50">Essence / Main</button>
    </div>

    <!-- Две колонки с серверами -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
      
      <!-- Скоро открытие -->
      <div>
        <h2 class="text-lg font-bold text-emerald-400 mb-3 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          Скоро открытие
        </h2>
        <div id="upcoming-list" class="space-y-3"></div>
      </div>

      <!-- Уже открылись -->
      <div>
        <h2 class="text-lg font-bold text-amber-400 mb-3 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          Уже открылись
        </h2>
        <div id="opened-list" class="space-y-3"></div>
      </div>

    </div>

  </div>

  <!-- Подвал сайта (Footer) -->
  <footer style="background-color: rgba(18, 18, 18, 0.85); color: #888; padding: 20px; font-family: sans-serif; font-size: 12px; text-align: center; line-height: 1.6; border-top: 1px solid rgba(255, 255, 255, 0.05);" class="mt-auto rounded-t-xl backdrop-blur-md">
    <p style="margin: 0 0 8px 0;">
      Сведения, размещенные на сайте, носят исключительно информационно-ознакомительный характер.
    </p>
    <p style="margin: 0 0 8px 0;">
      Lineage II is a registered trademark of NCSoft Corporation.
    </p>
    <p style="margin: 0;">
      <a href="https://t.me/Misterpandatipa" target="_blank" style="color: #aaa; text-decoration: underline;">Контакты</a>
    </p>
  </footer>

  <script>
    const GOOGLE_SHEET_CSV_URL = '';

    let defaultServers = [
      {
        id: 7,
        name: "ColdWar",
        chronicle: "High Five",
        rates: "x75",
        date: "14 Авг 2026",
        status: "opened",
        isVip: false,
        url: "https://coldwar24.ru/",
        features: ["Стаксаб 1+5", "Без штрафа на грейд", "Автофарм / Нулы", "Крафт Дополнений", "ПА х2-х5"],
        desc: "High Five x75 зі стаксабом (1+5, макс рівень 85). Автовивчення скілів 1-80. Немає штрафу на грейд шмоту, але є штраф на мобів (9 рівнів). Доступні автофарм, нули, апи та багаторівневий крафт доповнень (1-10 рівень)."
      },
      {
        id: 6,
        name: "Multi-Classic",
        chronicle: "Main/Essence",
        rates: "x10",
        date: "21 Авг 2026",
        status: "upcoming",
        isVip: false,
        url: "https://multi-classic.top/",
        features: ["Нулы и Апы", "Апонулы", "Скиллы за Нулы", "Брошки и Камни", "Классический цикл"],
        desc: "Переверенная временем концепция мультипрофы на Classic x10! Полный спектр развития: нулы, апы, апонулы. Новые скиллы (Аппетит и др.) за монетки с нулов. Брошки, драгоценные камни и глубокая прокачка."
      },
      {
        id: 5,
        name: "RoseMulti",
        chronicle: "Main/Essence",
        rates: "x1",
        date: "21 Авг 2026",
        status: "upcoming",
        isVip: false,
        url: "https://rosemulti.ru/",
        features: ["Перерождения", "Пассивные баффы", "Оффлайн фарм", "TG Бот", "Увеличенный спавн мобов"],
        desc: "Новые хроники RoseVain с уникальным классом на Essence! Скиллы за перерождения, удобный оффлайн фарм с TG ботом. Положительные баффы переведены в пассивки. Увеличенное количество мобов на локациях и быстрый респ!"
      },
      {
        id: 4,
        name: "Multi.ws",
        chronicle: "Interlude",
        rates: "x2",
        date: "28 Авг 2026",
        status: "upcoming",
        isVip: false,
        url: "https://multi.ws/",
        features: ["Мультипрофа", "Разрешен бот", "Автофарм", "Клан скиллы", "Костюмы", "Бесконечные соски"],
        desc: "Интерлюд х2 с мультипрофой. Разрешен бот и привычный автофарм. Основные баффы перенесены в клан-скиллы, добавлены костюмы со статами, апы и нулы. При наличии ПА соски и стрелы бесконечные."
      },
      {
        id: 1,
        name: "Абрикоска",
        chronicle: "Interlude",
        rates: "x5",
        date: "22 Авг 2026",
        status: "upcoming",
        isVip: false,
        url: "https://абрикоска.ком",
        features: ["Стаксаб", "Автофарм", "Бафф 24ч", "Апгрейд шмота"],
        desc: "Свежий Interlude x5 со стаксабом! На сервере доступен удобный автофарм, бафф на 24 часа и система апгрейда экипировки для комфортного развития."
      },
      {
        id: 2,
        name: "Lineage2 MultiProf",
        chronicle: "Interlude",
        rates: "x13",
        date: "28 Авг 2026",
        status: "upcoming",
        isVip: false,
        url: "#",
        features: ["Мультипрофа", "Кастомные скиллы", "Autofarm"],
        desc: "Топовый сервер с уникальной механикой мультипрофессии! Огромный выбор комбинаций скиллов и сбалансированная пвп-арена."
      },
      {
        id: 3,
        name: "Scryde Mega",
        chronicle: "High Five",
        rates: "x50",
        date: "10 Авг 2026",
        status: "opened",
        isVip: false,
        url: "#",
        features: ["Solo / Party", "Custom Costumes"],
        desc: "Огромный онлайн, стабильный проект. Добавлены уникальные ивенты и переработанные зоны спойла."
      }
    ];

    let servers = [];
    let currentChronicleFilter = 'ALL';

    function initData() {
      if (GOOGLE_SHEET_CSV_URL && !GOOGLE_SHEET_CSV_URL.includes('ВСТАВЬ_СЮДА')) {
        Papa.parse(GOOGLE_SHEET_CSV_URL, {
          download: true,
          header: true,
          complete: function(results) {
            servers = results.data.map((item, index) => ({
              id: item.id || index,
              name: item.name || '',
              chronicle: item.chronicle || '',
              rates: item.rates || '',
              date: item.date || '',
              status: item.status ? item.status.trim().toLowerCase() : 'upcoming',
              isVip: item.isVip ? item.isVip.trim().toUpperCase() === 'TRUE' : false,
              url: item.url || '#',
              features: item.features ? item.features.split(',').map(f => f.trim()) : [],
              desc: item.desc || ''
            })).filter(s => s.name !== '');

            renderServers();
          }
        });
      } else {
        servers = defaultServers;
        renderServers();
      }
    }

    // Проверка, открылся ли сервер по дате
    function isServerOpened(dateStr) {
      const months = {
        'Янв': 0, 'Фев': 1, 'Мар': 2, 'Апр': 3, 'Май': 4, 'Июн': 5,
        'Июл': 6, 'Авг': 7, 'Сен': 8, 'Окт': 9, 'Ноя': 10, 'Дек': 11
      };
      
      const parts = dateStr.split(' ');
      const day = parseInt(parts[0]);
      const month = months[parts[1]];
      const year = parseInt(parts[2]);
      
      const serverDate = new Date(year, month, day);
      const currentDate = new Date();
      
      return currentDate >= serverDate;
    }

    function renderServers() {
      const vipContainer = document.getElementById('vip-container');
      const upcomingContainer = document.getElementById('upcoming-list');
      const openedContainer = document.getElementById('opened-list');
      
      vipContainer.innerHTML = '';
      upcomingContainer.innerHTML = '';
      openedContainer.innerHTML = '';

      const filtered = servers.filter(s => currentChronicleFilter === 'ALL' || s.chronicle === currentChronicleFilter);

      const vipServer = filtered.find(s => s.isVip);
      if (vipServer) {
        vipContainer.innerHTML = createServerCardHtml(vipServer, true);
      } else {
        vipContainer.innerHTML = `
          <div class="glass-panel border-2 border-dashed border-amber-400/50 rounded-xl p-5 text-center shadow-lg transition hover:border-amber-400">
            <div class="text-amber-400 text-base font-bold mb-0.5">
              МЕСТО ДЛЯ VIP РЕКЛАМЫ
            </div>
            <p class="text-slate-300 text-xs">Закрепите ваш сервер на самом видном месте анонсера</p>
          </div>
        `;
      }

      filtered.filter(s => !s.isVip).forEach(server => {
        const cardHtml = createServerCardHtml(server, false);
        if (isServerOpened(server.date)) {
          openedContainer.innerHTML += cardHtml;
        } else {
          upcomingContainer.innerHTML += cardHtml;
        }
      });
    }

    function createServerCardHtml(server, isVip) {
      const borderClass = isVip 
        ? 'vip-card border-2 border-amber-400' 
        : 'glass-panel hover:bg-slate-900/90 border border-slate-700/60';
        
      const vipBadge = isVip ? `
        <div class="absolute -right-12 -top-12 bg-amber-400 text-slate-950 font-black text-xs px-12 py-8 rotate-45 flex items-end justify-center shadow-md">
          VIP
        </div>` : '';

      const serverOpened = isServerOpened(server.date);
      const statusDot = serverOpened 
        ? `<span class="relative flex h-2.5 w-2.5">
             <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
             <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500" title="Онлайн / Открыт"></span>
           </span>`
        : `<span class="inline-flex rounded-full h-2.5 w-2.5 bg-amber-400" title="Скоро открытие"></span>`;

      const featuresHtml = server.features.map(f => 
        `<span class="bg-slate-950/80 border border-slate-700/80 text-[11px] text-amber-400 px-1.5 py-0.5 rounded">${f}</span>`
      ).join('');

      return `
        <div class="${borderClass} rounded-xl transition overflow-hidden relative shadow-lg">
          ${vipBadge}
          <div onclick="toggleDetails(${server.id})" class="p-3.5 cursor-pointer flex items-center justify-between select-none">
            
            <div class="flex items-center gap-2.5">
              ${statusDot}
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-white text-base leading-tight">${server.name}</span>
                  <span class="bg-amber-400/20 text-amber-300 text-[11px] px-1.5 py-0.2 rounded border border-amber-400/30 font-semibold">${server.rates}</span>
                </div>
                <div class="text-[11px] text-slate-400 mt-0.5">${server.chronicle}</div>
              </div>
            </div>
            
            <div class="flex items-center gap-4">
              <div class="text-right">
                <div class="text-xs font-semibold text-slate-200">${server.date}</div>
                <span class="text-[10px] text-amber-400">Подробнее</span>
              </div>
              <span id="arrow-${server.id}" class="text-slate-400 text-[10px] transition-transform duration-300 transform inline-block">▼</span>
            </div>
          </div>

          <div id="details-${server.id}" class="accordion-content">
            <div class="accordion-inner">
              <div class="p-3.5 pt-0 border-t border-slate-700/40 mt-1">
                <div class="flex flex-wrap gap-1 mb-2.5 mt-2.5">
                  ${featuresHtml}
                </div>
                <p class="text-slate-300 text-xs leading-relaxed mb-3">
                  ${server.desc}
                </p>
                <div class="flex justify-end">
                  <a href="${server.url}" target="_blank" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-3.5 py-1.5 rounded-lg transition inline-flex items-center gap-1">
                    Перейти на сайт &rarr;
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleDetails(id) {
      const detailsBlock = document.getElementById(`details-${id}`);
      const arrowIcon = document.getElementById(`arrow-${id}`);
      const isOpen = detailsBlock.classList.contains('open');

      if (isOpen) {
        detailsBlock.classList.remove('open');
        arrowIcon.style.transform = 'rotate(0deg)';
      } else {
        detailsBlock.classList.add('open');
        arrowIcon.style.transform = 'rotate(180deg)';
      }
    }

    function filterChronicle(chronicle) {
      currentChronicleFilter = chronicle;
      renderServers();
    }

    initData();
  </script>
</body>
</html>
