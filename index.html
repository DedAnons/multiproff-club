    let servers = [];
    let currentChronicleFilter = 'ALL';

    function parseServerDate(dateStr) {
      if (!dateStr) return new Date(0);
      const allMonths = {
        'Янв': 0, 'Фев': 1, 'Мар': 2, 'Апр': 3, 'Май': 4, 'Июн': 5,
        'Июл': 6, 'Авг': 7, 'Сен': 8, 'Окт': 9, 'Ноя': 10, 'Дек': 11,
        'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5,
        'Jul': 6, 'Aug': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11
      };
      
      const parts = dateStr.trim().split(' ');
      const day = parseInt(parts[0]) || 1;
      const month = allMonths[parts[1]] !== undefined ? allMonths[parts[1]] : 0;
      const year = parseInt(parts[2]) || 2026;
      
      return new Date(year, month, day);
    }

    function formatDateForLang(dateStr, lang) {
      const dateObj = parseServerDate(dateStr);
      const day = dateObj.getDate();
      const month = monthNames[lang][dateObj.getMonth()];
      const year = dateObj.getFullYear();
      return `${day} ${month} ${year}`;
    }

    function isServerOpened(dateStr) {
      const serverDate = parseServerDate(dateStr);
      const currentDate = new Date();
      currentDate.setHours(0, 0, 0, 0);
      return currentDate >= serverDate;
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('multiproff_lang', lang);
      updateLanguageUI();
      renderServers();
    }

    function updateLanguageUI() {

      document.getElementById('title-upcoming').innerText = t.titleUpcoming;
      document.getElementById('title-opened').innerText = t.titleOpened;
      document.getElementById('footer-info').innerText = t.footerInfo;

      // Переключение подсветки кнопок языков
      const btnRu = document.getElementById('btn-lang-ru');
      const btnEn = document.getElementById('btn-lang-en');

      if (currentLang === 'ru') {
        btnRu.className = "px-2.5 py-1 rounded bg-amber-400 text-slate-950 font-bold transition shadow-sm";
        btnEn.className = "px-2.5 py-1 rounded text-slate-400 hover:text-white transition";
      } else {
        btnEn.className = "px-2.5 py-1 rounded bg-amber-400 text-slate-950 font-bold transition shadow-sm";
        btnRu.className = "px-2.5 py-1 rounded text-slate-400 hover:text-white transition";
      }
    }

    function initData() {
      updateLanguageUI();

      if (GOOGLE_SHEET_CSV_URL && !GOOGLE_SHEET_CSV_URL.includes('ВСТАВЬ_СЮДА')) {
        Papa.parse(GOOGLE_SHEET_CSV_URL, {
          download: true,
          header: true,
          complete: function(results) {
            servers = results.data.map((item, index) => ({
              id: item.id || index,
              name: item.name || '',
              chronicle: item.chronicle || '',
              rates: item.rates || '',
              date: item.date || '',
              isVip: item.isVip ? item.isVip.trim().toUpperCase() === 'TRUE' : false,
              url: item.url || '#',
              features: {
                ru: item.features ? item.features.split(',').map(f => f.trim()) : [],
                en: item.features_en ? item.features_en.split(',').map(f => f.trim()) : (item.features ? item.features.split(',').map(f => f.trim()) : [])
              },
              desc: {
                ru: item.desc || '',
                en: item.desc_en || item.desc || ''
              }
            })).filter(s => s.name !== '');

            renderServers();
          }
        });
      } else {
        servers = defaultServers;
        renderServers();
      }
    }

    function renderServers() {
      const t = i18n[currentLang];
      const vipContainer = document.getElementById('vip-container');
      const upcomingContainer = document.getElementById('upcoming-list');
      const openedContainer = document.getElementById('opened-list');
      
      vipContainer.innerHTML = '';
      upcomingContainer.innerHTML = '';
      openedContainer.innerHTML = '';

      const filtered = servers.filter(s => currentChronicleFilter === 'ALL' || s.chronicle === currentChronicleFilter);

      // VIP Блок
      const vipServer = filtered.find(s => s.isVip);
      if (vipServer) {
        vipContainer.innerHTML = createServerCardHtml(vipServer, true);
      } else {
        vipContainer.innerHTML = `
          <div class="glass-panel border-2 border-dashed border-amber-400/50 rounded-xl p-5 text-center shadow-lg transition hover:border-amber-400">
            <div class="text-amber-400 text-base font-bold mb-0.5">
              ${t.vipTitle}
            </div>
            <p class="text-slate-300 text-xs">${t.vipDesc}</p>
          </div>
        `;
      }

      // Сортировка и разделение
      const nonVipServers = filtered.filter(s => !s.isVip);
      const upcomingServers = nonVipServers.filter(s => !isServerOpened(s.date));
      const openedServers = nonVipServers.filter(s => isServerOpened(s.date));

      upcomingServers.sort((a, b) => parseServerDate(a.date) - parseServerDate(b.date));
      openedServers.sort((a, b) => parseServerDate(b.date) - parseServerDate(a.date));

      upcomingServers.forEach(server => {
        upcomingContainer.innerHTML += createServerCardHtml(server, false);
      });

      openedServers.forEach(server => {
        openedContainer.innerHTML += createServerCardHtml(server, false);
      });
    }

    function createServerCardHtml(server, isVip) {
      const t = i18n[currentLang];
      const borderClass = isVip 
        ? 'vip-card border-2 border-amber-400' 
        : 'glass-panel hover:bg-slate-900/90 border border-slate-700/60';
        
      const vipBadge = isVip ? `
        <div class="absolute -right-12 -top-12 bg-amber-400 text-slate-950 font-black text-xs px-12 py-8 rotate-45 flex items-end justify-center shadow-md">
          VIP
        </div>` : '';

      const serverOpened = isServerOpened(server.date);
      const statusDot = serverOpened 
        ? `<span class="relative flex h-2.5 w-2.5">
             <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
             <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500" title="${t.statusOnline}"></span>
           </span>`
        : `<span class="inline-flex rounded-full h-2.5 w-2.5 bg-amber-400" title="${t.statusUpcoming}"></span>`;

      // Получаем теги и описание согласно текущему языку
      const activeFeatures = (server.features && server.features[currentLang]) ? server.features[currentLang] : (server.features.ru || []);
      const activeDesc = (server.desc && server.desc[currentLang]) ? server.desc[currentLang] : (server.desc.ru || '');

      const featuresHtml = activeFeatures.map(f => 
        `<span class="bg-slate-950/80 border border-slate-700/80 text-[11px] text-amber-400 px-1.5 py-0.5 rounded">${f}</span>`
      ).join('');

      const formattedDate = formatDateForLang(server.date, currentLang);

      return `
        <div class="${borderClass} rounded-xl transition overflow-hidden relative shadow-lg">
          ${vipBadge}
          <div onclick="toggleDetails(${server.id})" class="p-3.5 cursor-pointer flex items-center justify-between select-none">
            
            <div class="flex items-center gap-2.5">
              ${statusDot}
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-white text-base leading-tight">${server.name}</span>
                  <span class="bg-amber-400/20 text-amber-300 text-[11px] px-1.5 py-0.2 rounded border border-amber-400/30 font-semibold">${server.rates}</span>
                </div>
                <div class="text-[11px] text-slate-400 mt-0.5">${server.chronicle}</div>
              </div>
            </div>
            
            <div class="flex items-center gap-4">
              <div class="text-right">
                <div class="text-xs font-semibold text-slate-200">${formattedDate}</div>
                <span class="text-[10px] text-amber-400">${t.details}</span>
              </div>
              <span id="arrow-${server.id}" class="text-slate-400 text-[10px] transition-transform duration-300 transform inline-block">▼</span>
            </div>
          </div>

          <div id="details-${server.id}" class="accordion-content">
            <div class="accordion-inner">
              <div class="p-3.5 pt-0 border-t border-slate-700/40 mt-1">
                <div class="flex flex-wrap gap-1 mb-2.5 mt-2.5">
                  ${featuresHtml}
                </div>
                <p class="text-slate-300 text-xs leading-relaxed mb-3">
                  ${activeDesc}
                </p>
                <div class="flex justify-end">
                  <a href="${server.url}" target="_blank" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-3.5 py-1.5 rounded-lg transition inline-flex items-center gap-1">
                    ${t.visitWebsite} &rarr;
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleDetails(id) {
      const detailsBlock = document.getElementById(`details-${id}`);
      const arrowIcon = document.getElementById(`arrow-${id}`);
      const isOpen = detailsBlock.classList.contains('open');

      if (isOpen) {
        detailsBlock.classList.remove('open');
        arrowIcon.style.transform = 'rotate(0deg)';
      } else {
        detailsBlock.classList.add('open');
        arrowIcon.style.transform = 'rotate(180deg)';
      }
    }

    function filterChronicle(chronicle) {
      currentChronicleFilter = chronicle;
      renderServers();
    }

    initData();
  </script>
</body>
</html>
