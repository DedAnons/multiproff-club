<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiproff Club — Анонсер серверов Lineage 2</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --panel-bg: #161920;
      --accent-color: #ffaa00;
      --text-color: #e0e0e0;
      --text-muted: #8a8f99;
      --border-color: #262b36;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }

    /* ШАПКА САЙТА */
    .header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Кнопка связи (слева) */
    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(255, 170, 0, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .contact-btn:hover {
      background-color: var(--accent-color);
      color: #000;
    }

    /* Логотип / Название (по центру) */
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--accent-color);
    }

    /* Переключатель языка (справа) */
    .lang-switcher {
      display: flex;
      gap: 4px;
      background-color: var(--bg-color);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 5px 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .lang-btn.active, .lang-btn:hover {
      background-color: var(--panel-bg);
      color: var(--accent-color);
    }

    /* ОСНОВНОЙ КОНТЕНТ */
    .main-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .server-list-title {
      font-size: 22px;
      margin-bottom: 20px;
      color: #fff;
      border-left: 4px solid var(--accent-color);
      padding-left: 12px;
    }

    .server-table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--panel-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .server-table th, .server-table td {
      padding: 14px 18px;
      text-align: left;
    }

    .server-table th {
      background-color: rgba(0, 0, 0, 0.3);
      color: var(--text-muted);
      font-size: 13px;
      text-transform: uppercase;
    }

    .server-table tr:not(:last-child) {
      border-bottom: 1px solid var(--border-color);
    }

    .server-name {
      font-weight: bold;
      color: #fff;
    }

    .chronicle-badge {
      background-color: var(--bg-color);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ФУТЕР */
    .footer {
      text-align: center;
      padding: 25px;
      margin-top: 50px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- ШАПКА С ОБНОВЛЕННЫМ РАСПОЛОЖЕНИЕМ КНОПОК -->
  <header class="header">
    <div class="header-container">
      
      <!-- Кнопка связь (слева) -->
      <a href="https://t.me/your_telegram" class="contact-btn" target="_blank" rel="noopener">
        <span>✈</span> Связь
      </a>

      <!-- Логотип -->
      <div class="logo">
        Multiproff <span>Club</span>
      </div>

      <!-- Кнопка смены языка (вернулась на прежнее место справа) -->
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>

    </div>
  </header>

  <!-- ОСНОВНАЯ ЧАСТЬ -->
  <main class="main-container">
    <h2 class="server-list-title">Анонсы серверов Lineage 2 Multiproff</h2>

    <table class="server-table">
      <thead>
        <tr>
          <th>Открытие</th>
          <th>Название сервера</th>
          <th>Хроники</th>
          <th>Рейты</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Скоро</td>
          <td class="server-name">Multiproff Custom x100</td>
          <td><span class="chronicle-badge">High Five</span></td>
          <td>x100</td>
        </tr>
        <tr>
          <td>В процессе</td>
          <td class="server-name">Multiskill World x10</td>
          <td><span class="chronicle-badge">Interlude</span></td>
          <td>x10</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer class="footer">
    &copy; 2026 Multiproff Club. Все права защищены.
  </footer>

  <script>
    // Простой скрипт переключения активности языковых кнопок
    const langButtons = document.querySelectorAll('.lang-btn');
    langButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        langButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>

</body>
</html>
